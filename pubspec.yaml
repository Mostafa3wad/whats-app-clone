name: whats_app_clone
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  # Core
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.7.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.1.0

  # Functional Programming
  dartz: ^0.10.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^7.0.0

  # Storage
  sqflite: ^2.4.1
  hive_flutter: ^1.1.0

  # Serialization and JSON Handling
  json_annotation: ^4.9.0
  flutter_lorem: ^2.0.0

  # Media and Utilities
  flutter_svg: ^2.0.16
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Logging
  logger: ^2.5.0

  # UI
  flutter_screenutil: ^5.9.3
  pinput: ^6.0.1
  
dev_dependencies:
  # Code Generation
  build_runner: ^2.4.14
  json_serializable: ^6.9.2

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

